app = "dev-pulse-live"
primary_region = "nrt"

[build]

[env]
  PHX_HOST    = "dev-pulse-live.fly.dev"
  PHX_SERVER  = "true"
  ECTO_IPV6   = "true"
  PORT        = "8080"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
